[package]
name = "secure_flash"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# A hardware-agnostic, encryption-aware flash storage layer for chips where
# flash encryption is enabled. Provides:
#
#  - `PlainFlashStorage`: uses plain SPI reads/writes, hardcodes capacity to
#    avoid `esp-storage`'s broken capacity detection on encrypted chips.
#    Suitable for NVS/user-data partitions.
#
#  - `EncryptedOtaStorage`: routes reads through caller-mapped decrypted
#    regions (e.g. cache MMU) and writes through the chip's encryption
#    hardware, with per-block buffering and per-sector erase tracking so
#    sub-block updates (like the OTA library's seq/state/crc fields) work
#    correctly.
#
# Hardware backends implement the `FlashHardware` trait. ESP32-C3 backend is
# included behind the `esp32c3` feature. A pure-Rust mock backend is included
# behind `mock` for tests on the host.

[dependencies]
embedded-storage = "0.3.1"

[features]
default = []
# Enable the ESP32-C3 hardware backend (target_arch = "riscv32").
esp32c3 = []
# Enable the in-memory mock backend used by host tests and downstream tests.
mock = []
