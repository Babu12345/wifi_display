[target.riscv32imc-unknown-none-elf]
# Development: Uses espflash's default bootloader with app at 0x10000, 1.5MB size
# Secure boot: Uses esp-idf bootloader with app at 0x20000 (see secure-flash.sh)
runner = "espflash flash --monitor -f 20mhz -s 8mb --partition-table partitions.csv"

[build]
target = "riscv32imc-unknown-none-elf"
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C",
  "force-frame-pointers",
]

[unstable]
build-std = ["alloc", "core"]


[alias]
r = "run --release"
s = "size --release"
sa = "size --bin async_main --release -- -A"
c = "check --release"
# These 2 are from an external dependecency called cargo-bloat
bf = "bloat --release -n 10" # Get the top 10 largest functions (by binary size)
bc = "bloat --release --crates -n 10" # Get the top 10 largest crates (by binary size)
f = "fmt"

# Secure boot: build release binary and save as app.bin (run sign-and-flash.sh after)
b = "build --release"

# Production: reduced logging for power savings
p = "run --release --features production"
pb = "build --release --features production"

[env]
# Disable USB PHY for power savings in production (~10-20mA)
# Serial logging via USB will not work, but flashing still works
ESP_WIFI_CONFIG_PHY_ENABLE_USB = "false"

# # Increase listen interval for power savings (default: 3)
# # With 100ms beacon interval, 10 = wake every 1 second instead of 300ms
# # Reduces WiFi wake-ups by ~70% when using PowerSaveMode::Maximum
ESP_WIFI_CONFIG_LISTEN_INTERVAL = "10"

# Reduce WiFi buffers for lower RAM usage (MQTT doesn't need much bandwidth)
ESP_WIFI_CONFIG_STATIC_RX_BUF_NUM = "4"   # Default: 10
ESP_WIFI_CONFIG_DYNAMIC_RX_BUF_NUM = "12" # Default: 32
ESP_WIFI_CONFIG_DYNAMIC_TX_BUF_NUM = "12" # Default: 32

[net]
git-fetch-with-cli = true