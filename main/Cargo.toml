[package]
name = "main"
version = "1.0.0"
edition = "2024"

[features]
default = []
# Production mode: reduces logging to warnings/errors only for power savings
production = []
# Secure boot mode: partition table is at 0x10000 instead of 0x8000
secure-boot = []

[dependencies]

# Internal
decoding = { path = "../decoding" }

# External
embassy-sync = "0.7.2"
embassy-futures = "0.1.1"
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "exception-handler",
    "println",
    # "panic-handler",
] }

esp-hal = { version = "0.23.0", features = ["esp32c3"] }
esp-println = { version = "0.12.0", features = ["esp32c3", "log"] }
log = { version = "0.4.21" }
esp-alloc = { version = "0.6.0" }
embedded-io-async = "0.6.1"
heapless = { version = "0.8.0", default-features = false, features = ["serde"] }
serde-json-core = "0.6.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
bincode = { version = "2.0", default-features = false, features = ["serde"] }
embassy-executor = { version = "0.7.0", features = ["task-arena-size-65536"] }
embassy-time = { version = "^0.4", features = ["generic-queue-8"] }
esp-hal-embassy = { version = "^0.6.0", features = ["esp32c3"] }
static_cell = { version = "2.1.0" }
esp-storage = { version = "0.4.0", features = ["esp32c3"] }
embedded-storage = "0.3.1"

esp-wifi = { version = "0.12.0", default-features = false, features = [
    "esp32c3",
    "esp-alloc",
    "wifi",
] }

embassy-net = { version = "0.6.0", features = [
    "tcp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
rust-mqtt = { version = "=0.3.0", default-features = false }
rand_core = { version = "0.6", default-features = false }
esp-mbedtls = { git = "https://github.com/Babu12345/esp-mbedtls/", package = "esp-mbedtls", branch = "custom", default-features = false, features = [
    "esp32c3",
    "async",
] }

# Private GitHub repos — HTTPS requires a PAT in your git credential helper
# (e.g. `gh auth login` or osxkeychain). Use SSH urls instead if that's not set up.
nfc = { git = "https://github.com/Babu12345/rusty_nfc.git", rev = "0796621c3fce15030b83a26531a274700fb5edce", default-features = false }
error = { git = "https://github.com/Babu12345/eink_display.git", rev = "0bcda985d8c42e39c5d0551bbc1a68cd0cd7c2db", default-features = false }
spi = { git = "https://github.com/Babu12345/eink_display.git", rev = "0bcda985d8c42e39c5d0551bbc1a68cd0cd7c2db", default-features = false }
display = { git = "https://github.com/Babu12345/eink_display.git", rev = "0bcda985d8c42e39c5d0551bbc1a68cd0cd7c2db", default-features = false }
storage = { git = "https://github.com/Babu12345/display_storage.git", rev = "f96c4f8c7cef2a9874f16e6768c2e08db86d70c4", default-features = false }
text = { git = "https://github.com/Babu12345/eink_display.git", rev = "0bcda985d8c42e39c5d0551bbc1a68cd0cd7c2db", default-features = false }
url = { git = "https://github.com/Babu12345/eink_display.git", rev = "0bcda985d8c42e39c5d0551bbc1a68cd0cd7c2db", default-features = false }
ota = { git = "https://github.com/Babu12345/ota.git", rev = "a706a408f97161ae76a2ea770dc08c6f33e3c87b" }
secure_flash = { git = "https://github.com/Babu12345/secure_flash.git", rev = "b33e4c8715cf8cedcc10e6b4435a79598d362cee", features = [
    "esp32c3",
] }
esp-hal-ota = { git = "https://github.com/Babu12345/secure_flash.git", rev = "b33e4c8715cf8cedcc10e6b4435a79598d362cee", features = [
    "esp32c3",
    "log",
] }

# Patch esp-wifi to use forked version with configurable TX power
[patch.crates-io]
esp-wifi = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }
esp-hal = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }
esp-alloc = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }
esp-config = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }
esp-build = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }
esp-metadata = { git = "https://github.com/Babu12345/esp-hal", branch = "esp-wifi-0.12.0-power-config" }

[build-dependencies]
dotenvy = "0.15"
